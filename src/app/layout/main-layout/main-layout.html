<div class="layout-shell">
  <app-sidebar
    class="layout-sidebar"
    [class.layout-sidebar--open]="isMobileMenuOpen()"></app-sidebar>

  <div class="layout-main">
    <header class="mobile-header shrink-0">
      <button
        type="button"
        class="mobile-menu-btn"
        (click)="openMobileMenu()"
        aria-label="Abrir menú">
        <lucide-icon [img]="icons.Menu" class="w-5 h-5"></lucide-icon>
      </button>
      <app-pollux-brand-text class="mobile-header__brand" [useSystemLogo]="true" />
    </header>

    <main class="main-workspace flex-1 min-w-0 bg-gray-100">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
