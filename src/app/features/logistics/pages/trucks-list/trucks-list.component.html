<div class="logistics-page">
  <header class="logistics-page__header">
    <div class="logistics-page__titles">
      <h2>Flota y remolques</h2>
    </div>
    <div class="logistics-page__actions">
      <button
        *hasPermission="permissions.create"
        type="button"
        class="page-create-btn"
        (click)="openCreate()"
      >
        Nuevo camión
      </button>
    </div>
  </header>

  <div class="logistics-toolbar">
    <input
      type="search"
      class="logistics-field logistics-toolbar__search"
      placeholder="Buscar unidad o placa"
      aria-label="Buscar unidad o placa"
      [value]="search"
      (input)="onSearchInput($any($event.target).value)"
    />

    <button
      type="button"
      class="trucks-active-btn"
      [class.trucks-active-btn--on]="onlyActive"
      [attr.aria-pressed]="onlyActive"
      (click)="onOnlyActiveChange(!onlyActive)"
    >
      <span class="trucks-active-btn__check" aria-hidden="true">
        @if (onlyActive) {
          <svg viewBox="0 0 16 16" fill="none" width="12" height="12">
            <path
              d="M3.5 8.5L6.5 11.5L12.5 4.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </span>
      Solo activos
    </button>

    <app-filter-clear-button [active]="hasActiveFilters" (clear)="clearFilters()">
    </app-filter-clear-button>
  </div>

  <app-datatable-wrapper
    variant="modern"
    [config]="table_config()"
    [rowTemplate]="tableTemplate"
    (pageChange)="onPageChange($event)"
    (rowClick)="openEdit($event.data)"
  >
  </app-datatable-wrapper>
</div>

<ng-template #tableTemplate let-item="$implicit">
  <td>
    <div class="truck-thumb">
      @if (item.photo) {
        <img [src]="item.photo" [alt]="item.name" class="truck-thumb__img" loading="lazy" />
      } @else {
        <div class="truck-thumb__placeholder" aria-hidden="true"></div>
      }
    </div>
  </td>
  <td>
    <p class="dt-cell-primary m-0 truncate">{{ item.name }}</p>
  </td>
  <td>
    <span class="dt-folio-badge">{{ item.placa }}</span>
  </td>
  <td>
    <p class="m-0" [class]="trailerOf(item) === '—' ? 'dt-cell-subtle' : 'dt-cell-muted'">{{ trailerOf(item) }}</p>
  </td>
  <td>
    <p class="m-0" [class]="serialNumberOf(item) === '—' ? 'dt-cell-subtle' : 'dt-cell-muted'">{{ serialNumberOf(item) }}</p>
  </td>
  <td>
    <p class="m-0" [class]="item.anio ? 'dt-cell-muted' : 'dt-cell-subtle'">{{ item.anio || '—' }}</p>
  </td>
  <td>
    <span
      class="dt-status-pill"
      [class.dt-status-pill--success]="item.carta_porte_ready"
      [class.dt-status-pill--warning]="!item.carta_porte_ready"
      [title]="(item.carta_porte_missing || []).join('. ')"
    >
      {{ item.carta_porte_ready ? 'Lista' : 'Faltan datos' }}
    </span>
  </td>
  <td>
    <span [ngClass]="getStatusClass(item.status)">
      {{ getStatusLabel(item.status) }}
    </span>
  </td>
  <td>
    <div class="flex items-center gap-2" (click)="$event.stopPropagation()">
      <button
        *hasPermission="permissions.update"
        type="button"
        class="p-1.5 rounded hover:bg-gray-100 text-gray-600"
        title="Editar"
        (click)="openEdit(item, $event)"
      >
        <lucide-icon [img]="Edit2" class="w-4 h-4"></lucide-icon>
      </button>
      @if (item.status === 'active') {
        <button
          *hasPermission="permissions.delete"
          type="button"
          class="p-1.5 rounded hover:bg-red-50 text-red-600"
          title="Desactivar"
          (click)="deactivate(item, $event)"
        >
          <lucide-icon [img]="Trash2" class="w-4 h-4"></lucide-icon>
        </button>
      }
    </div>
  </td>
</ng-template>
