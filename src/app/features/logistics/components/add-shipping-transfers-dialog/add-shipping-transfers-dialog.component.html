<div class="add-stops">
  <div class="add-stops__header">
    <h2>Agregar transferencias al envío</h2>
    <lucide-icon [img]="X" class="cursor-pointer w-5 h-5 text-gray-500" (click)="close()"></lucide-icon>
  </div>

  <div class="add-stops__list">
    @if (loading()) {
      <p class="text-sm text-gray-500 p-4"><app-spinner></app-spinner></p>
    } @else if (!transfers().length) {
      <p class="text-sm text-gray-500 p-4">No hay transferencias pendientes en esta sucursal.</p>
    } @else {
      @for (transfer of transfers(); track transfer.id) {
        <label class="add-stops__row">
          <input type="checkbox" [checked]="isSelected(transfer.id)" (change)="toggle(transfer.id)" />
          <span>{{ transferLabel(transfer) }}</span>
        </label>
      }
    }
  </div>

  <div class="add-stops__footer">
    <app-button text="Cancelar" custom_class="btn_secondary" (clicked)="close()"></app-button>
    <app-button
      text="Agregar"
      custom_class="btn_primary"
      [disabled]="!selected.size || saving()"
      (clicked)="submit()"
    ></app-button>
  </div>
</div>
