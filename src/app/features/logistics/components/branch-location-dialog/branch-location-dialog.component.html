<div class="whl-dialog">
  <div class="whl-dialog__header">
    <div>
      <h2>Ubicación de la sucursal</h2>
      <p>{{ branchName }}</p>
    </div>
    <lucide-icon [img]="X" class="cursor-pointer w-5 h-5 text-gray-500" (click)="close()"></lucide-icon>
  </div>

  @if (loading()) {
    <div class="whl-dialog__body"><app-spinner></app-spinner></div>
  } @else {
    <div class="whl-dialog__body">
      <app-location-map-fields
        [formGroup]="form"
        streetControl="address"
        postalControl="postal_code"
        streetLabel="Calle"
        postalLabel="C.P."
        [coordsRequired]="true"
        [mapActive]="mapActive"
      ></app-location-map-fields>
    </div>
  }

  <div class="whl-dialog__footer">
    <app-button
      text="Cancelar"
      variant="secondary"
      size="sm"
      [fullWidth]="false"
      (clicked)="close()"
    ></app-button>
    <app-button
      text="Guardar ubicación"
      variant="primary"
      size="sm"
      customClass="btn_primary"
      [fullWidth]="false"
      [disabled]="saving() || loading()"
      (clicked)="save()"
    ></app-button>
  </div>
</div>
