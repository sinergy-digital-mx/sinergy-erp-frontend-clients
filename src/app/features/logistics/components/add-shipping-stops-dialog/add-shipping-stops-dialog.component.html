<div class="add-stops">
  <div class="add-stops__header">
    <h2>Agregar órdenes al envío</h2>
    <lucide-icon [img]="X" class="cursor-pointer w-5 h-5 text-gray-500" (click)="close()"></lucide-icon>
  </div>

  <div class="add-stops__toolbar">
    <app-search class="flex-1" [param_activate]="false" (searchChange)="onSearch($event)"></app-search>
  </div>

  <div class="add-stops__list">
    @if (loading()) {
      <p class="text-sm text-gray-500 p-4">Cargando órdenes surtidas…</p>
    } @else if (!orders().length) {
      <p class="text-sm text-gray-500 p-4">No hay órdenes Surtida disponibles en este almacén.</p>
    } @else {
      @for (order of orders(); track order.id) {
        <label class="add-stops__row">
          <input type="checkbox" [checked]="isSelected(order.id)" (change)="toggle(order.id)" />
          <span>{{ orderLabel(order) }}</span>
        </label>
      }
    }
  </div>

  <div class="add-stops__pager">
    <button type="button" class="text-sm" [disabled]="page <= 1" (click)="prevPage()">Anterior</button>
    <span class="text-sm text-gray-500">{{ page }} / {{ totalPages }}</span>
    <button type="button" class="text-sm" [disabled]="page >= totalPages" (click)="nextPage()">Siguiente</button>
  </div>

  <div class="add-stops__footer">
    <app-button text="Cancelar" custom_class="btn_secondary" (clicked)="close()"></app-button>
    <app-button
      text="Agregar"
      custom_class="btn_primary"
      [disabled]="!selected.size || saving()"
      (clicked)="submit()"
    ></app-button>
  </div>
</div>
