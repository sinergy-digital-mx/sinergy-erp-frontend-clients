<div class="line-dialog">
  <div class="line-dialog__header">
    <div>
      <h3 class="line-dialog__title">{{ dialogTitle }}</h3>
      <p class="line-dialog__product">{{ productName }}</p>
    </div>
    <button
      type="button"
      class="line-dialog__close"
      aria-label="Cerrar"
      [disabled]="saving()"
      (click)="cancel()">
      <i class="fi fi-rr-cross-small"></i>
    </button>
  </div>

  <div class="line-dialog__body">
    <div class="line-dialog__grid">
      <div class="field">
        <label for="so-line-qty">Cantidad</label>
        <input
          id="so-line-qty"
          type="number"
          class="form-input"
          min="0.001"
          step="any"
          [(ngModel)]="quantity"
          [disabled]="saving()">
      </div>

      <div class="field">
        <label for="so-line-price">Precio unitario</label>
        <div class="field__with-badge">
          <input
            id="so-line-price"
            type="number"
            class="form-input"
            min="0"
            step="any"
            [(ngModel)]="unitPrice"
            [disabled]="saving()">
          <span class="currency-badge" [class.currency-badge--usd]="data.currency === 'USD'">
            {{ data.currency }}
          </span>
        </div>
      </div>

      <div class="field field--full">
        <label for="so-line-iva">IVA %</label>
        <div class="tax-row">
          @for (preset of taxPresets; track preset) {
            <button
              type="button"
              class="tax-chip"
              [class.is-active]="isTaxPreset(ivaPercentage, preset)"
              [disabled]="saving()"
              (click)="setIva(preset)">
              {{ preset }}%
            </button>
          }
          <input
            id="so-line-iva"
            type="number"
            class="form-input tax-row__input"
            min="0"
            max="100"
            step="0.01"
            [(ngModel)]="ivaPercentage"
            [disabled]="saving()">
        </div>
      </div>

      <div class="field field--full">
        <label for="so-line-ieps">IEPS %</label>
        <div class="tax-row">
          @for (preset of taxPresets; track preset) {
            <button
              type="button"
              class="tax-chip"
              [class.is-active]="isTaxPreset(iepsPercentage, preset)"
              [disabled]="saving()"
              (click)="setIeps(preset)">
              {{ preset }}%
            </button>
          }
          <input
            id="so-line-ieps"
            type="number"
            class="form-input tax-row__input"
            min="0"
            max="100"
            step="0.01"
            [(ngModel)]="iepsPercentage"
            [disabled]="saving()">
        </div>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="line-dialog__error" role="alert">{{ errorMessage() }}</p>
    }
  </div>

  <div class="line-dialog__footer">
    <button type="button" class="line-dialog__btn line-dialog__btn--cancel" [disabled]="saving()" (click)="cancel()">
      Cancelar
    </button>
    <button type="button" class="line-dialog__btn line-dialog__btn--save" [disabled]="saving()" (click)="save()">
      @if (saving()) {
        <i class="fi fi-rr-spinner animate-spin" aria-hidden="true"></i>
        Guardando...
      } @else {
        Guardar
      }
    </button>
  </div>
</div>
