<div class="dialog-overlay" (click)="close()">
  <div
    class="dialog-container"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-labelledby="advance-invoice-title"
    aria-modal="true">
    <div class="dialog-header">
      <h2 id="advance-invoice-title">{{ title }}</h2>
      <button type="button" class="close-button" (click)="close()" [disabled]="saving()" aria-label="Cerrar">
        <i class="fi fi-rr-cross-small"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="dialog-body">
        <p class="advance-hint">{{ hint }}</p>

        @if (data.mode === 'stamp') {
          <div class="form-field">
            <label for="advance-percent">Porcentaje de la cotización <span>*</span></label>
            <input
              id="advance-percent"
              class="form-input"
              type="number"
              min="1"
              max="100"
              step="1"
              formControlName="percent"
            />
          </div>
          <div class="summary-card">
            <div class="summary-row">
              <span>Anticipo con IVA</span>
              <strong class="pending">{{ formatMoney(chargeTotal) }}</strong>
            </div>
            <p class="summary-note">Sin desglose de partidas.</p>
          </div>
        }

        <div class="form-field">
          <label for="advance-uso">Uso CFDI <span>*</span></label>
          <input id="advance-uso" class="form-input" type="text" formControlName="uso_cfdi" />
        </div>

        @if (data.mode === 'stamp') {
          <div class="form-field">
            <label for="advance-forma">Cómo pagó <span>*</span></label>
            <select id="advance-forma" class="form-select" formControlName="forma_pago">
              <option value="01">Efectivo</option>
              <option value="04">Tarjeta</option>
              <option value="03">Transferencia</option>
              <option value="02">Cheque</option>
            </select>
          </div>
        } @else {
          <div class="form-field">
            <label for="advance-forma">Forma de pago <span>*</span></label>
            <input id="advance-forma" class="form-input" type="text" formControlName="forma_pago" />
          </div>
        }

        <div class="form-field">
          <label for="advance-regimen">Régimen del receptor <span>*</span></label>
          <input
            id="advance-regimen"
            class="form-input"
            type="text"
            formControlName="regimen_fiscal_receptor"
          />
        </div>

        @if (error()) {
          <p class="advance-error" role="alert">{{ error() }}</p>
        }
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn-cancel" (click)="close()" [disabled]="saving()">Cancelar</button>
        <button type="submit" class="btn-submit" [disabled]="saving() || form.invalid">
          {{ saving() ? 'Timbrando…' : submitLabel }}
        </button>
      </div>
    </form>
  </div>
</div>
