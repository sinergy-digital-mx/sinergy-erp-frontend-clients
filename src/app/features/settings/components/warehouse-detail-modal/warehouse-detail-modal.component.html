<div class="warehouse-modal">
  <div class="warehouse-modal__header">
    <h2>{{ isNew ? 'Nuevo Almacén' : 'Editar Almacén' }}</h2>
    <lucide-icon [img]="X" class="close cursor-pointer" (click)="close()"> </lucide-icon>
  </div>

  <div class="warehouse-modal__body">
    <form [formGroup]="form" class="warehouse-form">
      <div class="warehouse-form__meta">
        <div class="col-span-2">
          <label>Nombre *</label>
          <input type="text" formControlName="name" placeholder="Nombre del almacén" />
          <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="err">
            Nombre requerido (mín. 2 caracteres)
          </p>
        </div>

        <div>
          <label>Código</label>
          <input type="text" formControlName="code" class="uppercase" placeholder="Ej: ALM-001" />
        </div>

        <div>
          <label>Status</label>
          <app-select [config]="statusSelectConfig" (changeOption)="onStatusChange($event)">
          </app-select>
        </div>

        <div class="col-span-2">
          <label>Descripción</label>
          <textarea formControlName="description" rows="2" placeholder="Descripción del almacén"></textarea>
        </div>

        <div *ngIf="!nested" class="col-span-2">
          <label>Sucursal</label>
          <app-select [config]="branchSelectConfig" (changeOption)="onBranchChange($event)">
          </app-select>
        </div>
      </div>

      <div class="warehouse-form__location">
        <h3>Ubicación</h3>
        <app-location-map-fields
          [formGroup]="form"
          streetControl="street"
          postalControl="zip_code"
          streetLabel="Calle"
          postalLabel="C.P."
          [mapActive]="mapActive"
        ></app-location-map-fields>
      </div>
    </form>
  </div>

  <div class="warehouse-modal__footer">
    <app-button text="Cancelar" custom_class="btn_secondary" [fullWidth]="false" (clicked)="close()">
    </app-button>
    <app-button
      [text]="isNew ? 'Crear Almacén' : 'Guardar Cambios'"
      custom_class="btn_primary"
      [fullWidth]="false"
      [loading]="saving()"
      [disabled]="form.invalid || saving()"
      (clicked)="save()"
    >
    </app-button>
  </div>
</div>
