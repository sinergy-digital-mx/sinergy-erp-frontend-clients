<div class="settings-list-page px-4 pb-6">
  <div class="product-list-header">
    <h2 class="product-list-header__title">Productos</h2>
    <div class="product-list-header__actions">
      <div class="product-list-btn-group" role="group" aria-label="Administrar catálogo">
        <button
          type="button"
          class="product-list-btn-group__btn"
          (click)="openCategoriesDialog()">
          Categorías
        </button>
        <button
          type="button"
          class="product-list-btn-group__btn"
          (click)="openUOMsDialog()">
          Unidades
        </button>
        <button
          type="button"
          class="product-list-btn-group__btn"
          (click)="openPriceListsDialog()">
          Listas de precios
        </button>
      </div>

      @if (canExportCatalog) {
        <button
          type="button"
          class="product-list-header__export"
          (click)="openCatalogExportDialog()">
          <i class="fi fi-rr-download" aria-hidden="true"></i>
          Descargar catálogo
        </button>
      }

      @if (canUpdateCatalog) {
        <button
          type="button"
          class="product-list-header__import"
          (click)="openVendorImportDialog()">
          <i class="fi fi-rr-upload" aria-hidden="true"></i>
          Importar
        </button>
      }

      <button
        type="button"
        class="product-list-header__create"
        (click)="openCreateProductModal()">
        <lucide-icon [img]="Plus" [size]="16"></lucide-icon>
        Nuevo producto o servicio
      </button>
    </div>
  </div>

  <div class="product-list-filters mb-4">
    <app-search
      class="product-list-filters__search"
      [param_activate]="false"
      [default_value]="search"
      (searchChange)="onSearchChange($event)">
    </app-search>

    <select
      class="product-list-filters__kind"
      [value]="itemKindFilter"
      (change)="onItemKindChange($any($event.target).value)">
      <option value="">Todos</option>
      <option value="goods">Productos</option>
      <option value="service">Servicios</option>
    </select>

    <app-filter-clear-button
      [active]="hasActiveFilters"
      (clear)="clearFilters()">
    </app-filter-clear-button>
  </div>

  <app-datatable-wrapper
    variant="settings"
    [config]="table_config()"
    [rowTemplate]="tableTemplate"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (rowClick)="viewDetail($event)">
  </app-datatable-wrapper>
</div>

<ng-template #tableTemplate let-item="$implicit">
  <td>
    <p class="settings-cell-primary truncate">{{ item.name }}</p>
  </td>
  <td>
    <span class="settings-badge">{{ itemKindLabel(item.item_kind) }}</span>
  </td>
  <td>
    <span class="settings-badge settings-badge--code">{{ item.sku }}</span>
  </td>
  <td>
    <span [class]="item.category?.name ? 'settings-cell-text' : 'settings-cell-empty'">
      {{ item.category?.name || '—' }}
    </span>
  </td>
  <td>
    <span [class]="item.subcategory?.name ? 'settings-cell-text' : 'settings-cell-empty'">
      {{ item.subcategory?.name || '—' }}
    </span>
  </td>
</ng-template>
