<div class="settings-list-page px-4 pb-6">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
    <h2 class="text-2xl font-semibold text-gray-800">Proveedores</h2>

    <div class="vendor-list__actions">
      <button
        type="button"
        class="vendor-list__export-btn"
        (click)="openExportModal()">
        <i class="fi fi-rr-download" aria-hidden="true"></i>
        Descargar Excel
      </button>

      <app-button
        text="Nuevo Proveedor"
        customClass="btn_primary"
        [fullWidth]="false"
        (clicked)="openCreateVendorModal()">
      </app-button>
    </div>
  </div>

  <div class="vendor-list__toolbar mb-4">
    <select
      class="vendor-type-filter"
      [value]="vendorTypeFilter"
      (change)="onVendorTypeFilterChange($any($event.target).value)">
      <option *ngFor="let opt of vendorTypeFilterOptions" [value]="opt.value">{{ opt.label }}</option>
    </select>

    <app-search
      class="vendor-list__search"
      [showSearchIcon]="true"
      placeholder="Buscar proveedores..."
      [param_activate]="false"
      [default_value]="search"
      (searchChange)="onSearchChange($event)">
    </app-search>

    <button
      type="button"
      class="vendor-similar-filter"
      [class.vendor-similar-filter--on]="similarOnly"
      (click)="toggleSimilarOnly()">
      Solo parecidos
    </button>

    <app-filter-clear-button
      [active]="hasActiveFilters"
      (clear)="clearFilters()">
    </app-filter-clear-button>
  </div>

  <app-datatable-wrapper
    variant="settings"
    [config]="table_config()"
    [rowTemplate]="tableTemplate"
    (pageChange)="onPageChange($event)"
    (rowClick)="viewDetail($event)">
  </app-datatable-wrapper>
</div>

<ng-template #tableTemplate let-item="$implicit">
  <td>
    <p class="settings-cell-primary truncate">{{ item.name }}</p>
  </td>
  <td>
    <span [class]="item.company_name ? 'settings-cell-text' : 'settings-cell-empty'">
      {{ item.company_name || '—' }}
    </span>
  </td>
  <td>
    <span class="settings-badge" [ngClass]="getVendorTypeBadgeClass(item.vendor_type)">
      {{ getVendorTypeLabel(item.vendor_type) }}
    </span>
  </td>
  <td>
    <span [class]="getFiscalId(item) !== '—' ? 'settings-cell-mono' : 'settings-cell-empty'">
      {{ getFiscalId(item) }}
    </span>
  </td>
  <td>
    <div class="vendor-completeness" [attr.data-level]="completenessLevel(item.profile_completeness)">
      <div class="vendor-completeness__bar" aria-hidden="true">
        <span [style.width.%]="item.profile_completeness || 0"></span>
      </div>
      <span class="vendor-completeness__value">{{ item.profile_completeness || 0 }}%</span>
    </div>
  </td>
  <td>
    @if (item.looks_similar) {
      <span class="settings-badge settings-badge--similar" [title]="similarLabel(item)">
        Parecido
      </span>
    } @else {
      <span class="settings-cell-empty">—</span>
    }
  </td>
  <td>
    <span class="settings-badge" [ngClass]="getStatusClass(item.status)">
      {{ getStatusLabel(item.status) }}
    </span>
  </td>
  <td>
    <div class="settings-table-actions">
      <button
        *hasPermission="vendorDeletePermission"
        type="button"
        class="settings-table-action settings-table-action--danger"
        (click)="deleteVendor(item, $event)">
        Eliminar
      </button>
    </div>
  </td>
</ng-template>
