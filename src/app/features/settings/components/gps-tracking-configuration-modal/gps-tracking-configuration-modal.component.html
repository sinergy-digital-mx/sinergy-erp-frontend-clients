<div class="modal-container">
  <div class="modal-header">
    <h2>{{ isEdit ? 'Editar rastreo GPS' : 'Crear rastreo GPS' }}</h2>
    <button (click)="close()" class="close-button" type="button"><span class="text-2xl">&times;</span></button>
  </div>

  <div class="modal-body">
    <form [formGroup]="form" class="space-y-4">
      <div class="bg-blue-50 p-3 rounded border border-blue-200">
        <p class="text-xs text-blue-700">
          Proveedor <strong>3D Tracking</strong>. La contraseña se guarda cifrada. El enlace con cada camión es su placa.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" formControlName="name" placeholder="Ej: Flota Verdulería" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input type="text" formControlName="username" autocomplete="off" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" formControlName="password" autocomplete="new-password" [placeholder]="isEdit ? 'Déjala vacía para no cambiarla' : ''" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      @if (testResult(); as result) {
        <p class="text-sm rounded-md px-3 py-2" [class.bg-green-50]="result.ok" [class.text-green-800]="result.ok" [class.bg-amber-50]="!result.ok" [class.text-amber-900]="!result.ok">
          {{ result.message }}
        </p>
      }
    </form>
  </div>

  <div class="modal-footer flex justify-end gap-2">
    <app-button text="Probar conexión" variant="secondary" [fullWidth]="false" [disabled]="testing() || saving()" (clicked)="test()"></app-button>
    <app-button [text]="saving() ? 'Guardando…' : 'Guardar'" variant="primary" [fullWidth]="false" [loading]="saving()" (clicked)="save()"></app-button>
  </div>
</div>
