<div class="purchase-order-list-container">
  <div class="purchase-content">
    <div class="px-4">
      <div class="transfers-header">
        <h2 class="transfers-header__title">Transferencias</h2>
        <div class="flex items-center gap-2 flex-wrap">
          @if (canCreateTransfer) {
            <button type="button" class="page-create-btn" (click)="openCreate()">
              Crear
            </button>
          }
        </div>
      </div>

      <div class="transfers-toolbar">
        <div class="transfers-toolbar__search">
          <input
            type="text"
            class="transfers-search"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            (keyup.enter)="onSearch()"
            placeholder="Buscar folio, producto o SKU..."
          />
        </div>

        <div class="transfers-toolbar__actions">
          <div class="filters-anchor">
            <button
              type="button"
              class="filters-btn"
              [class.filters-btn--active]="hasPanelFilters"
              [class.filters-btn--open]="filtersOpen()"
              (click)="toggleFilters()"
              [attr.aria-expanded]="filtersOpen()">
              <lucide-icon [img]="ListFilter" [size]="16"></lucide-icon>
              <span>Filtros</span>
              @if (panelFilterCount > 0) {
                <span class="filters-btn__badge">{{ panelFilterCount }}</span>
              }
            </button>

            @if (filtersOpen()) {
              <div class="filters-panel" role="dialog" aria-label="Filtros de transferencias">
                <div class="filters-panel__sides">
                  <fieldset class="filters-side">
                    <legend>Origen</legend>
                    <div class="filters-field">
                      <label for="trfSourceFiscal">Razón social</label>
                      <select
                        id="trfSourceFiscal"
                        [ngModel]="draftSourceFiscalId()"
                        (ngModelChange)="onDraftSourceFiscalChange($event)">
                        <option value="">Todas</option>
                        @for (fiscal of locations(); track fiscal.id) {
                          <option [value]="fiscal.id">{{ fiscalLabel(fiscal) }}</option>
                        }
                      </select>
                    </div>
                    <div class="filters-field">
                      <label for="trfSourceBranch">Sucursal</label>
                      <select
                        id="trfSourceBranch"
                        [ngModel]="draftSourceBranchId()"
                        (ngModelChange)="onDraftSourceBranchChange($event)"
                        [disabled]="!draftSourceFiscalId()">
                        <option value="">Todas</option>
                        @for (branch of draftSourceBranches(); track branch.id) {
                          <option [value]="branch.id">{{ branchLabel(branch) }}</option>
                        }
                      </select>
                    </div>
                    <div class="filters-field">
                      <label for="trfSourceWh">Almacén</label>
                      <select
                        id="trfSourceWh"
                        [ngModel]="draftSourceWarehouseId()"
                        (ngModelChange)="draftSourceWarehouseId.set($event)"
                        [disabled]="!draftSourceBranchId()">
                        <option value="">Todos</option>
                        @for (wh of draftSourceWarehouses(); track wh.id) {
                          <option [value]="wh.id">{{ warehouseLabel(wh) }}</option>
                        }
                      </select>
                    </div>
                  </fieldset>

                  <fieldset class="filters-side">
                    <legend>Destino</legend>
                    <div class="filters-field">
                      <label for="trfDestFiscal">Razón social</label>
                      <select
                        id="trfDestFiscal"
                        [ngModel]="draftDestFiscalId()"
                        (ngModelChange)="onDraftDestFiscalChange($event)">
                        <option value="">Todas</option>
                        @for (fiscal of locations(); track fiscal.id) {
                          <option [value]="fiscal.id">{{ fiscalLabel(fiscal) }}</option>
                        }
                      </select>
                    </div>
                    <div class="filters-field">
                      <label for="trfDestBranch">Sucursal</label>
                      <select
                        id="trfDestBranch"
                        [ngModel]="draftDestBranchId()"
                        (ngModelChange)="onDraftDestBranchChange($event)"
                        [disabled]="!draftDestFiscalId()">
                        <option value="">Todas</option>
                        @for (branch of draftDestBranches(); track branch.id) {
                          <option [value]="branch.id">{{ branchLabel(branch) }}</option>
                        }
                      </select>
                    </div>
                    <div class="filters-field">
                      <label for="trfDestWh">Almacén</label>
                      <select
                        id="trfDestWh"
                        [ngModel]="draftDestWarehouseId()"
                        (ngModelChange)="draftDestWarehouseId.set($event)"
                        [disabled]="!draftDestBranchId()">
                        <option value="">Todos</option>
                        @for (wh of draftDestWarehouses(); track wh.id) {
                          <option [value]="wh.id">{{ warehouseLabel(wh) }}</option>
                        }
                      </select>
                    </div>
                  </fieldset>
                </div>

                <div class="filters-panel__dates">
                  <div class="filters-field">
                    <label for="trfFrom">Desde</label>
                    <input
                      id="trfFrom"
                      type="date"
                      [ngModel]="draftCreatedFrom()"
                      (ngModelChange)="draftCreatedFrom.set($event)"
                    />
                  </div>
                  <div class="filters-field">
                    <label for="trfTo">Hasta</label>
                    <input
                      id="trfTo"
                      type="date"
                      [ngModel]="draftCreatedTo()"
                      (ngModelChange)="draftCreatedTo.set($event)"
                    />
                  </div>
                </div>

                <div class="filters-panel__footer">
                  <button type="button" class="filters-panel__cancel" (click)="closeFilters()">
                    Cancelar
                  </button>
                  <button type="button" class="filters-panel__apply" (click)="applyFilters()">
                    Aplicar
                  </button>
                </div>
              </div>
            }
          </div>

          <app-filter-clear-button
            [active]="hasActiveFilters"
            (clear)="clearFilters()">
          </app-filter-clear-button>
        </div>
      </div>

      <app-datatable-wrapper
        variant="modern"
        [config]="table_config()"
        [rowTemplate]="tableTemplate"
        (pageChange)="onPageChange($event)"
        (rowClick)="openTransferDetail($event.data)">
      </app-datatable-wrapper>
    </div>
  </div>
</div>

<ng-template #tableTemplate let-item="$implicit">
  <td>
    <button
      type="button"
      class="folio-open-btn"
      (click)="openTransferDetail(item, $event)"
      title="Ver detalle de la transferencia">
      {{ item.folio }}
    </button>
  </td>
  <td>
    <div class="trf-product">
      <span class="transfer-product truncate">{{ productTitle(item) }}</span>
      <span class="transfer-product-sku truncate">{{ quantityLabel(item) }} · {{ productSubtitle(item) }}</span>
    </div>
  </td>
  <td>
    <span class="trf-route">
      <span class="truncate">{{ branchLine(sourceView(item)) }}</span>
      <span class="trf-route__arrow" aria-hidden="true">→</span>
      <span class="truncate">{{ branchLine(destView(item)) }}</span>
    </span>
  </td>
  <td>
    <span class="trf-state" [class]="'trf-state trf-state--' + statusTone(item.status)">
      {{ statusLabel(item.status) }}
    </span>
  </td>
  <td>
    <span class="trf-date">{{ formatDate(item.created_at) }}</span>
  </td>
</ng-template>
