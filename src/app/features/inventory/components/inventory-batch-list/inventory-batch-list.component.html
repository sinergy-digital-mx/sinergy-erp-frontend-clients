<div class="purchase-order-list-container">
  <div class="purchase-content">
    <div class="px-4">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-800">Inventario</h2>
        <div class="flex items-center gap-2 flex-wrap">
          <button
            type="button"
            class="page-export-btn"
            (click)="openExportModal()">
            <i class="fi fi-rr-download" aria-hidden="true"></i>
            Descargar Excel
          </button>
          <a
            routerLink="/inventory/existencia"
            class="page-export-btn no-underline">
            <lucide-icon [img]="ChartColumn" [size]="14"></lucide-icon>
            Existencia
          </a>
          <a
            routerLink="/transfers"
            class="page-export-btn no-underline">
            <lucide-icon [img]="ArrowRightLeft" [size]="14"></lucide-icon>
            Transferencias
          </a>
          <a
            routerLink="/inventory/audits"
            class="page-export-btn no-underline">
            <lucide-icon [img]="ClipboardCheck" [size]="14"></lucide-icon>
            Auditorías
          </a>
        </div>
      </div>

      @if (canViewStats()) {
        <app-inventory-stats-cards
          [stats]="stats()"
          [loading]="statsLoading()"
          [failed]="statsFailed()"
          [showMoney]="canViewMargin()">
        </app-inventory-stats-cards>
      }

      @if (!branchReport()) {
      <div class="mb-4">
        <div class="filter-bar" role="search" aria-label="Filtros de inventario">
          <div class="filter-bar__container">
            <div class="filter-bar__field filter-bar__field--search">
              <input
                type="text"
                [ngModel]="state.searchTerm()"
                (ngModelChange)="onSearchInput($event)"
                (keyup.enter)="onSearch()"
                placeholder="Buscar..."
                title="Pon ! al final para buscar el código exacto. Ejemplo: 1x12!"
                class="filter-bar__input"
                [class.filter-bar__input--clearable]="!!state.searchTerm()"
                aria-label="Buscar por lote o producto. Con ! al final el código es exacto"
              />
              @if (state.searchTerm()) {
                <button
                  type="button"
                  class="filter-bar__search-clear"
                  (click)="clearSearch()"
                  aria-label="Quitar búsqueda">
                  <lucide-icon [img]="X" [size]="14"></lucide-icon>
                </button>
              }
            </div>
            <div class="filter-bar__field">
              <select
                [ngModel]="state.selectedFiscalId()"
                (ngModelChange)="onFiscalChange($event)"
                class="filter-bar__select"
                aria-label="Filtrar por razón social"
              >
                <option value="">Todas las razones sociales</option>
                @for (fiscal of locations(); track fiscal.id) {
                  <option [value]="fiscal.id">{{ fiscalOptionLabel(fiscal) }}</option>
                }
              </select>
            </div>
            <div class="filter-bar__field">
              <select
                [ngModel]="state.selectedBranchId()"
                (ngModelChange)="onBranchChange($event)"
                [disabled]="!state.selectedFiscalId()"
                class="filter-bar__select"
                aria-label="Filtrar por sucursal"
              >
                <option value="">Todas las sucursales</option>
                @for (branch of branchOptions(); track branch.id) {
                  <option [value]="branch.id">{{ branch.name }}</option>
                }
              </select>
            </div>
            <div class="filter-bar__field">
              <select
                [ngModel]="state.selectedWarehouseId()"
                (ngModelChange)="onWarehouseChange($event)"
                [disabled]="!state.selectedBranchId()"
                class="filter-bar__select"
                aria-label="Filtrar por almacén"
              >
                <option value="">Todos los almacenes</option>
                @for (warehouse of warehouseOptions(); track warehouse.id) {
                  <option [value]="warehouse.id">{{ warehouse.name }}</option>
                }
              </select>
            </div>
            <div class="filter-bar__field filter-bar__field--clear">
              <app-filter-clear-button
                [active]="hasActiveFilters"
                (clear)="clearFilters()">
              </app-filter-clear-button>
            </div>
          </div>
        </div>
      </div>
      }

      <div class="inventory-tabs">
        <nav>
          <a
            routerLink="lotes"
            queryParamsHandling="preserve"
            routerLinkActive
            #lotesTab="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.is-active]="lotesTab.isActive">
            Por lotes
          </a>
          <a
            routerLink="totalizado"
            queryParamsHandling="preserve"
            routerLinkActive
            #totalizadoTab="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.is-active]="totalizadoTab.isActive">
            Totalizado
          </a>
          <a
            routerLink="sucursal"
            queryParamsHandling="preserve"
            routerLinkActive
            #sucursalTab="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
            [class.is-active]="sucursalTab.isActive">
            Por sucursal
          </a>
        </nav>
      </div>

      <router-outlet />
    </div>
  </div>
</div>
