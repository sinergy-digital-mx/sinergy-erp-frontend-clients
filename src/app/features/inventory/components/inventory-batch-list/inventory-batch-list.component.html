<div class="purchase-order-list-container">
  <div class="purchase-content">
    <div class="px-4">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
        <h2 class="text-2xl font-semibold text-gray-800">Inventario</h2>
        <div class="flex items-center gap-2 flex-wrap">
          <button
            type="button"
            class="page-export-btn"
            (click)="openExportModal()">
            <i class="fi fi-rr-download" aria-hidden="true"></i>
            Descargar Excel
          </button>
          <a
            routerLink="/inventory/transfers"
            class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-lg hover:bg-indigo-100 transition-colors">
            <lucide-icon [img]="ArrowRightLeft" [size]="16"></lucide-icon>
            Transferencias
          </a>
          <a
            routerLink="/inventory/audits"
            class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-lg hover:bg-indigo-100 transition-colors">
            <lucide-icon [img]="ClipboardCheck" [size]="16"></lucide-icon>
            Auditorías
          </a>
        </div>
      </div>

      <app-inventory-stats-cards
        [stats]="stats()"
        [loading]="statsLoading()"
        [failed]="statsFailed()">
      </app-inventory-stats-cards>

      <div class="mb-4">
        <div class="filter-bar" role="search" aria-label="Filtros de inventario">
          <div class="filter-bar__container">
            <div class="filter-bar__field">
              <input
                type="text"
                [ngModel]="state.searchTerm()"
                (ngModelChange)="state.searchTerm.set($event)"
                (keyup.enter)="onSearch()"
                placeholder="Buscar..."
                class="filter-bar__input"
                aria-label="Buscar por lote o producto"
              />
            </div>
            <div class="filter-bar__field">
              <select
                [ngModel]="state.selectedFiscalId()"
                (ngModelChange)="onFiscalChange($event)"
                class="filter-bar__select"
                aria-label="Filtrar por razón social"
              >
                <option value="">Todas las razones sociales</option>
                @for (fiscal of locations(); track fiscal.id) {
                  <option [value]="fiscal.id">{{ fiscalOptionLabel(fiscal) }}</option>
                }
              </select>
            </div>
            <div class="filter-bar__field">
              <select
                [ngModel]="state.selectedBranchId()"
                (ngModelChange)="onBranchChange($event)"
                [disabled]="!state.selectedFiscalId()"
                class="filter-bar__select"
                aria-label="Filtrar por sucursal"
              >
                <option value="">Todas las sucursales</option>
                @for (branch of branchOptions(); track branch.id) {
                  <option [value]="branch.id">{{ branch.name }}</option>
                }
              </select>
            </div>
            <div class="filter-bar__field">
              <select
                [ngModel]="state.selectedWarehouseId()"
                (ngModelChange)="onWarehouseChange($event)"
                [disabled]="!state.selectedBranchId()"
                class="filter-bar__select"
                aria-label="Filtrar por almacén"
              >
                <option value="">Todos los almacenes</option>
                @for (warehouse of warehouseOptions(); track warehouse.id) {
                  <option [value]="warehouse.id">{{ warehouse.name }}</option>
                }
              </select>
            </div>
            <div class="filter-bar__field filter-bar__field--clear">
              <app-filter-clear-button
                [active]="hasActiveFilters"
                (clear)="clearFilters()">
              </app-filter-clear-button>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-4">
        <div class="border-b border-gray-200">
          <nav class="-mb-px flex space-x-8">
            <a
              routerLink="lotes"
              routerLinkActive
              #lotesTab="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: true }"
              class="border-b-2 py-4 px-1 text-sm font-medium transition-colors"
              [class.border-blue-500]="lotesTab.isActive"
              [class.text-blue-600]="lotesTab.isActive"
              [class.border-transparent]="!lotesTab.isActive"
              [class.text-gray-500]="!lotesTab.isActive">
              Por Lotes
            </a>
            <a
              routerLink="totalizado"
              routerLinkActive
              #totalizadoTab="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: true }"
              class="border-b-2 py-4 px-1 text-sm font-medium transition-colors"
              [class.border-blue-500]="totalizadoTab.isActive"
              [class.text-blue-600]="totalizadoTab.isActive"
              [class.border-transparent]="!totalizadoTab.isActive"
              [class.text-gray-500]="!totalizadoTab.isActive">
              Totalizado
            </a>
          </nav>
        </div>
      </div>

      <router-outlet />
    </div>
  </div>
</div>
