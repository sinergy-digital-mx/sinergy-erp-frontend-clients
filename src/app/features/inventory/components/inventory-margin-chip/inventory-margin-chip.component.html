<div class="margin-chip" [attr.data-source]="margin?.source || 'none'">
  @if (!margin) {
    <span class="margin-chip__empty">—</span>
  } @else {
    <span class="margin-chip__pct" [attr.data-tone]="tone">{{ percentLabel }}</span>
    <button
      type="button"
      class="margin-chip__info"
      [matTooltip]="tooltip || 'Sin dato de margen'"
      matTooltipPosition="above"
      matTooltipShowDelay="80"
      [attr.aria-label]="tooltip || 'Origen del margen'">
      <lucide-icon [img]="Info" [size]="13"></lucide-icon>
    </button>
  }
</div>
