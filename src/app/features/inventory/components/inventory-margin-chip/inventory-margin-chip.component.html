<div
  class="margin-chip"
  [attr.data-source]="margin?.source || 'none'"
  [attr.title]="tooltip">
  @if (!margin) {
    <span class="margin-chip__empty">—</span>
  } @else {
    <span class="margin-chip__pct" [attr.data-tone]="tone">{{ percentLabel }}</span>
    <span class="margin-chip__badge" [attr.data-source]="margin.source">{{ margin.source_label }}</span>
  }
</div>
