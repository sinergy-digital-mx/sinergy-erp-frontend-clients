<div class="ship-dialog">
  <header class="ship-dialog__header">
    <div>
      <p class="ship-dialog__kicker">Envío de transferencia</p>
      <h2>{{ data.transfer.folio }}</h2>
    </div>
    <button type="button" class="ship-dialog__close" (click)="close()" aria-label="Cerrar">
      <lucide-icon [img]="X" [size]="18"></lucide-icon>
    </button>
  </header>

  <p class="ship-dialog__lead">
    La mercancía sigue apartada. Este envío la pone en camino y ahí se timbra la carta porte.
  </p>

  <div class="ship-dialog__grid">
    <label>
      Fecha
      <input type="date" [(ngModel)]="shippingDate" />
    </label>
    <div class="ship-dialog__field">
      <div class="ship-dialog__field-label">
        <span>Unidad</span>
        <span class="ship-dialog__actions">
          @if (selectedTruck(); as truck) {
            <span
              class="ship-dialog__mark"
              [class.is-bad]="!truck.carta_porte_ready"
              [title]="markTitle(truck.carta_porte_ready, truck.carta_porte_missing)"
              [attr.aria-label]="markTitle(truck.carta_porte_ready, truck.carta_porte_missing)"
            >
              <lucide-icon [img]="truck.carta_porte_ready ? Check : CircleAlert" [size]="16"></lucide-icon>
            </span>
          }
          <button type="button" class="ship-dialog__edit" [disabled]="!truckId" (click)="editTruck()">
            Editar
          </button>
        </span>
      </div>
      <select [(ngModel)]="truckId">
        <option value="">Selecciona unidad</option>
        @for (truck of trucks(); track truck.id) {
          <option [value]="truck.id" [disabled]="!!truck.active_shipping_id">
            {{ truckSelectLabel(truck) }}{{ truck.active_shipping_id ? ' · ' + truckBusyLabel(truck) : '' }}
          </option>
        }
      </select>
    </div>
    <div class="ship-dialog__field">
      <div class="ship-dialog__field-label">
        <span>Chofer</span>
        <span class="ship-dialog__actions">
          @if (selectedDriver(); as driver) {
            <span
              class="ship-dialog__mark"
              [class.is-bad]="!driver.carta_porte_ready"
              [title]="markTitle(driver.carta_porte_ready, driver.carta_porte_missing)"
              [attr.aria-label]="markTitle(driver.carta_porte_ready, driver.carta_porte_missing)"
            >
              <lucide-icon [img]="driver.carta_porte_ready ? Check : CircleAlert" [size]="16"></lucide-icon>
            </span>
          }
          <button type="button" class="ship-dialog__edit" [disabled]="!driverId" (click)="editDriver()">
            Editar
          </button>
        </span>
      </div>
      <select [(ngModel)]="driverId">
        <option value="">Selecciona chofer</option>
        @for (driver of drivers(); track driver.id) {
          <option [value]="driver.id">{{ driverName(driver) }}</option>
        }
      </select>
    </div>
    <label class="ship-dialog__full">
      Notas
      <textarea rows="2" [(ngModel)]="notes" placeholder="Salida de bodega…"></textarea>
    </label>
  </div>

  <footer class="ship-dialog__footer">
    <button type="button" class="ship-dialog__secondary" (click)="close()">Cancelar</button>
    <button type="button" class="ship-dialog__primary" [disabled]="saving()" (click)="save()">
      {{ saving() ? 'Creando…' : 'Crear envío' }}
    </button>
  </footer>
</div>
