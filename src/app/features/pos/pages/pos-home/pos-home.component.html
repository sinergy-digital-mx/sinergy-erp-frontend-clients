<div class="pos-hub">
  <header class="pos-hub__session">
    <div class="pos-hub__session-inner">
      <div class="pos-hub__session-left">
        <lucide-icon [img]="LayoutGrid" class="pos-hub__ic" />
        <div>
          <p class="pos-hub__eyebrow">Punto de venta</p>
          <h1 class="pos-hub__title">Elige una app</h1>
        </div>
      </div>
    </div>
  </header>

  <p class="pos-hub__lead">
    Como gerente puedes operar <strong>Ventas</strong> y <strong>Cobranza</strong>. No se abre una sola app al iniciar sesión.
  </p>

  <div class="pos-hub__grid">
    @if (canSell()) {
      <button type="button" class="pos-tile" (click)="navigateToVentas()">
        <div class="pos-tile__icon">
          <lucide-icon [img]="ShoppingCart" class="pos-tile__lucide" />
        </div>
        <h3>Ventas</h3>
        <p>Catálogo, carrito y registro de pedidos</p>
      </button>
    }

    @if (canCollect()) {
      <button type="button" class="pos-tile" (click)="navigateToCobranza()">
        <div class="pos-tile__icon pos-tile__icon--amber">
          <lucide-icon [img]="Banknote" class="pos-tile__lucide" />
        </div>
        <h3>Cobranza</h3>
        <p>Corte del día, pendientes y cobro</p>
      </button>
    }
  </div>
</div>
