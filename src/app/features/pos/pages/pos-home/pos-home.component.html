<div class="pos-hub">
  <div class="pos-hub__stage">
    <header class="pos-hub__hero">
      <span class="pos-hub__badge">
        <lucide-icon [img]="LayoutGrid" class="pos-hub__badge-ic" />
        Punto de venta
      </span>
      <h1>¿Qué vas a hacer?</h1>
      <p>Tienes acceso a ambas apps. Entra a la que necesites ahora.</p>
    </header>

    <div class="pos-hub__grid">
      @if (canSell()) {
        <button type="button" class="pos-tile" (click)="navigateToVentas()">
          <div class="pos-tile__icon">
            <lucide-icon [img]="ShoppingCart" class="pos-tile__lucide" />
          </div>
          <h3>Ventas</h3>
          <p>Catálogo, carrito y registro</p>
          <span class="pos-tile__cta">Entrar</span>
        </button>
      }

      @if (canCollect()) {
        <button type="button" class="pos-tile pos-tile--amber" (click)="navigateToCobranza()">
          <div class="pos-tile__icon pos-tile__icon--amber">
            <lucide-icon [img]="Banknote" class="pos-tile__lucide" />
          </div>
          <h3>Cobranza</h3>
          <p>Corte del día, pendientes y cobro</p>
          <span class="pos-tile__cta pos-tile__cta--amber">Entrar</span>
        </button>
      }
    </div>
  </div>
</div>
