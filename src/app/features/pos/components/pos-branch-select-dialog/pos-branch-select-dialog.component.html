<div class="pos-dialog pos-branch-dialog">
  <h2 class="pos-dialog__title">Sucursal POS</h2>
  <p class="pos-dialog__subtitle">
    Inventario y corte son de la sucursal elegida. Si no tiene corte abierto, las ventas quedan en
    cola.
  </p>

  <label class="pos-branch-field">
    <span class="pos-branch-field__label">Sucursal</span>
    <div class="pos-branch-list" role="listbox" [attr.aria-disabled]="saving()">
      @for (branch of data.branches; track branch.id) {
        <button
          type="button"
          role="option"
          class="pos-branch-option"
          [class.pos-branch-option--on]="selectedId() === branch.id"
          [attr.aria-selected]="selectedId() === branch.id"
          [disabled]="saving()"
          (click)="selectBranch(branch)">
          <span
            class="pos-branch-option__radio"
            [class.pos-branch-option__radio--on]="selectedId() === branch.id"></span>
          <span class="pos-branch-option__copy">
            <span class="pos-branch-option__name">{{ branchTitle(branch) }}</span>
            @if (branchSubtitle(branch); as city) {
              <span class="pos-branch-option__meta">{{ city }}</span>
            }
          </span>
          @if (branch.is_primary) {
            <span class="pos-branch-option__badge">Principal</span>
          }
        </button>
      }
    </div>
  </label>

  @if (error()) {
    <p class="pos-dialog__error">{{ error() }}</p>
  }

  <div class="pos-dialog__actions">
    @if (!data.required) {
      <app-button
        text="Cancelar"
        customClass="btn_secondary"
        size="sm"
        [fullWidth]="false"
        [disabled]="saving()"
        (clicked)="cancel()"></app-button>
    }
    <app-button
      text="Continuar"
      customClass="btn_primary"
      size="sm"
      [fullWidth]="false"
      [loading]="saving()"
      (clicked)="confirm()"></app-button>
  </div>
</div>
