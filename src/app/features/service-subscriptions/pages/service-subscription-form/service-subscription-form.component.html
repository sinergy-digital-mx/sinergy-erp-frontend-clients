<div class="purchase-order-list-container">
  <div class="purchase-content">
    <div class="px-4 pb-10 max-w-3xl">
      <a routerLink="/service-subscriptions" class="text-sm text-blue-600">Volver</a>
      <h2 class="text-2xl font-semibold text-gray-800 mt-2">Nueva suscripción</h2>
      <p class="text-sm text-gray-500 mb-6">De un mes a otro, máximo 12. El monto es sin IVA.</p>

      <form class="grid grid-cols-1 md:grid-cols-2 gap-4" [formGroup]="form" (ngSubmit)="save()">
        <label class="block md:col-span-2">
          <span class="text-sm text-gray-600">Cliente</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="customer_search" (keyup.enter)="searchCustomers()" placeholder="Nombre, RFC o razón social" />
          @for (item of customers(); track item.id) {
            <button type="button" class="block w-full text-left text-sm px-2 py-1 hover:bg-gray-100" (click)="pickCustomer(item)">{{ item.label }}</button>
          }
        </label>

        <label class="block md:col-span-2">
          <span class="text-sm text-gray-600">Servicio</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="title" placeholder="Ej. Renta de software" />
        </label>

        <label class="block">
          <span class="text-sm text-gray-600">Monto mensual sin IVA</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" type="number" min="0" step="0.01" formControlName="monthly_amount" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">IVA %</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" type="number" min="0" step="0.01" formControlName="iva_percentage" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Mes inicial</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" type="month" formControlName="start_month" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Mes final</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" type="month" formControlName="end_month" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Día de cobro</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" type="number" min="1" max="28" formControlName="billing_day" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Razón social</span>
          <select class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="fiscal_configuration_id">
            <option value="">Selecciona</option>
            @for (item of fiscals(); track item.id) {
              <option [value]="item.id">{{ item.label }}</option>
            }
          </select>
        </label>
        <label class="block md:col-span-2">
          <span class="text-sm text-gray-600">Sucursal</span>
          <select class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="billing_branch_id">
            <option value="">Selecciona</option>
            @for (item of branches(); track item.id) {
              <option [value]="item.id">{{ item.label }}</option>
            }
          </select>
        </label>

        <label class="block md:col-span-2">
          <span class="text-sm text-gray-600">Producto de servicio</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="product_search" (keyup.enter)="searchProducts()" placeholder="Buscar servicio" />
          @for (item of products(); track item.id) {
            <button type="button" class="block w-full text-left text-sm px-2 py-1 hover:bg-gray-100" (click)="pickProduct(item)">{{ item.label }}</button>
          }
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Unidad</span>
          <select class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="product_uom_id">
            <option value="">Selecciona</option>
            @for (item of uoms(); track item.id) {
              <option [value]="item.id">{{ item.label }}</option>
            }
          </select>
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Régimen del cliente</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="regimen_fiscal_receptor" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Uso CFDI</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="uso_cfdi" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Forma de pago</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="forma_pago" />
        </label>
        <label class="block">
          <span class="text-sm text-gray-600">Método de pago</span>
          <input class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" formControlName="metodo_pago" />
        </label>
        <label class="block md:col-span-2">
          <span class="text-sm text-gray-600">Notas</span>
          <textarea class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2 text-sm" rows="2" formControlName="notes"></textarea>
        </label>

        <div class="md:col-span-2">
          <button type="submit" class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50" [disabled]="saving()">
            {{ saving() ? 'Guardando…' : 'Crear suscripción' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
