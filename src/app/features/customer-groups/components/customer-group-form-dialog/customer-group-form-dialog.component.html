<div class="customer-group-form-dialog">
  <div class="customer-group-form-dialog__header">
    <h2>{{ isNew ? 'Crear grupo' : 'Editar grupo' }}</h2>
    <lucide-icon [img]="X" class="close cursor-pointer" (click)="close()"></lucide-icon>
  </div>

  <div class="customer-group-form-dialog__body">
    <form [formGroup]="form">
      <div>
        <label class="field-label" for="customer-group-name">Nombre *</label>
        <input
          id="customer-group-name"
          type="text"
          formControlName="name"
          maxlength="255"
          class="field-input"
          placeholder="Ej: Mayoreo" />
        <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="field-error">
          El nombre es obligatorio (máx. 255 caracteres)
        </p>
      </div>

      <div>
        <label class="field-label" for="customer-group-description">Descripción</label>
        <textarea
          id="customer-group-description"
          formControlName="description"
          maxlength="2000"
          rows="4"
          class="field-input field-input--textarea"
          placeholder="Clientes de mayoreo"></textarea>
        <p *ngIf="form.get('description')?.invalid && form.get('description')?.touched" class="field-error">
          La descripción no puede superar 2000 caracteres
        </p>
      </div>
    </form>
  </div>

  <div class="customer-group-form-dialog__footer">
    <app-button text="Cancelar" variant="secondary" [fullWidth]="false" (clicked)="close()"></app-button>
    <app-button
      [text]="isNew ? 'Crear' : 'Guardar'"
      variant="primary"
      [fullWidth]="false"
      [loading]="saving()"
      (clicked)="save()">
    </app-button>
  </div>
</div>
