<div class="filter-bar" role="search" aria-label="Filtros de órdenes de compra">
  <div class="filter-bar__container">
    <!-- Search Input -->
    <div class="filter-bar__field">
      <input
        type="text"
        id="search"
        [formControl]="searchControl"
        placeholder="Buscar..."
        class="filter-bar__input"
        aria-label="Buscar órdenes por folio, proveedor o propósito"
      />
    </div>

    <!-- Date Range Dropdown -->
    <div class="filter-bar__field">
      <select
        id="dateRange"
        [formControl]="dateRangeControl"
        class="filter-bar__select"
        aria-label="Filtrar por rango de fecha"
      >
        <option value="">Fecha</option>
        @for (option of dateRangeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <!-- Custom Date Range (shown when "Rango" is selected) -->
    @if (showCustomDateRange) {
      <div class="filter-bar__field">
        <input
          type="date"
          id="dateFrom"
          [formControl]="dateFromControl"
          class="filter-bar__input"
          aria-label="Filtrar desde fecha"
        />
      </div>

      <div class="filter-bar__field">
        <input
          type="date"
          id="dateTo"
          [formControl]="dateToControl"
          class="filter-bar__input"
          aria-label="Filtrar hasta fecha"
        />
      </div>
    }

    <!-- Status Dropdown -->
    <div class="filter-bar__field">
      <select
        id="status"
        [formControl]="statusControl"
        class="filter-bar__select"
        aria-label="Filtrar por estado de orden"
      >
        <option [value]="null">Todos los estados</option>
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <!-- Razón social -->
    <div class="filter-bar__field">
      <select
        id="fiscalConfiguration"
        [formControl]="fiscalConfigurationControl"
        class="filter-bar__select"
        aria-label="Filtrar por razón social"
      >
        <option [ngValue]="null">Todas las razones sociales</option>
        @for (fc of fiscalConfigurations; track fc.id) {
          <option [ngValue]="fc.id">{{ fc.razon_social }}</option>
        }
      </select>
    </div>

    <!-- Sucursal -->
    <div class="filter-bar__field">
      <select
        id="billingBranch"
        [formControl]="billingBranchControl"
        class="filter-bar__select"
        aria-label="Filtrar por sucursal"
      >
        <option [ngValue]="null">Todas las sucursales</option>
        @for (branch of branches; track branch.id) {
          <option [ngValue]="branch.id">{{ branchLabel(branch) }}</option>
        }
      </select>
    </div>

    <!-- Almacén -->
    <div class="filter-bar__field">
      <select
        id="warehouse"
        [formControl]="warehouseControl"
        class="filter-bar__select"
        aria-label="Filtrar por almacén"
      >
        <option [ngValue]="null">Todos los almacenes</option>
        @for (warehouse of warehouses; track warehouse.id) {
          <option [ngValue]="warehouse.id">{{ warehouse.name }}</option>
        }
      </select>
    </div>

    <div class="filter-bar__field filter-bar__field--actions">
      <app-filter-clear-button
        [active]="hasActiveFilters"
        (clear)="clearFilters()">
      </app-filter-clear-button>
      <button
        type="button"
        class="filter-bar__refresh-button"
        [disabled]="refreshing"
        (click)="onRefresh()"
        title="Actualizar lista"
        aria-label="Actualizar lista">
        <svg
          class="filter-bar__refresh-icon"
          [class.filter-bar__refresh-icon--spin]="refreshing"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M20 12A8 8 0 1 1 12 4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round" />
          <path
            d="M20 4V9H15"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </div>
</div>
