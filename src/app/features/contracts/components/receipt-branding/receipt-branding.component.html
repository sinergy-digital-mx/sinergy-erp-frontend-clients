<div class="branding" [class.branding--dialog]="!embedded">
  <div class="branding-header" *ngIf="!embedded">
    <h2>Razón social del recibo</h2>
    <button type="button" class="close-button" (click)="close()"><span class="text-2xl">&times;</span></button>
  </div>

  <div class="branding-body">
    <p *ngIf="loading()" class="text-sm text-slate-500">Cargando…</p>

    <ng-container *ngIf="!loading() && template() as current">
      <p class="text-xs text-slate-500">
        El nombre y el logo de esta razón social salen en el PDF de enganches y de pagos.
      </p>
      <label class="block text-sm font-medium text-gray-700 mb-1 mt-3">Razón social</label>
      <select
        class="w-full px-3 py-2 border border-gray-300 rounded-md"
        [(ngModel)]="fiscalConfigurationId"
        (ngModelChange)="saveSelection()"
        [disabled]="saving || uploading">
        <option value="">La marcada como logo del sistema</option>
        <option *ngFor="let fiscal of current.fiscal_configurations" [value]="fiscal.id">
          {{ fiscal.razon_social }}
        </option>
      </select>
      <p class="text-xs text-slate-500 mt-1" *ngIf="saving">Guardando…</p>

      <div class="logo-preview">
        <img *ngIf="previewFiscal?.logo_url; else emptyLogo" [src]="previewFiscal?.logo_url" alt="Logo del recibo" />
        <ng-template #emptyLogo><span>Sin logo</span></ng-template>
      </div>

      <input #logoFile type="file" accept="image/png,image/jpeg,image/webp" hidden (change)="onFile($event)" />
      <button
        type="button"
        class="upload-button"
        [disabled]="uploading || !uploadTargetId"
        (click)="logoFile.click()">
        {{ uploading ? 'Subiendo…' : 'Subir logo' }}
      </button>
      <p class="text-xs text-slate-500 mt-1" *ngIf="!uploadTargetId">Selecciona la razón social para subir su logo.</p>
      <p class="text-xs text-slate-500 mt-1" *ngIf="previewFiscal">PNG, JPG o WEBP. Hasta 5 MB.</p>
    </ng-container>
  </div>

  <div class="branding-footer" *ngIf="!embedded">
    <button type="button" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-md" (click)="close()">Cerrar</button>
  </div>
</div>
