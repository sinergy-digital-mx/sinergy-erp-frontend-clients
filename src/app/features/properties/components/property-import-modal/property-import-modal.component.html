<div class="import-modal">
  <div class="import-modal__header">
    <h2>Importar lotes</h2>
    <app-close-button title="Cerrar" (clicked)="close()"></app-close-button>
  </div>

  <p class="import-modal__lead">
    Descarga la plantilla, llena una fila por lote y súbela. La fila «Lote ejemplo» no se importa.
    El código se crea como LOT-manzana-número. Si alguna fila falla, no se crea ningún lote.
  </p>

  <label class="import-modal__group">
    Grupo
    <select [(ngModel)]="groupId" [disabled]="importing">
      <option value="">Selecciona un grupo</option>
      <option *ngFor="let group of groups" [value]="group.id">{{ group.name }}</option>
    </select>
  </label>

  <button type="button" class="import-modal__download" (click)="downloadTemplate()" [disabled]="downloading">
    <lucide-icon [img]="Download" [size]="16"></lucide-icon>
    {{ downloading ? 'Descargando…' : 'Descargar plantilla' }}
  </button>

  <label class="import-modal__file">
    <input type="file" accept=".xlsx,.xls" (change)="onFileSelected($event)" />
    <span>{{ file ? file.name : 'Seleccionar archivo Excel' }}</span>
  </label>

  <ul class="import-modal__errors" *ngIf="errors.length">
    <li *ngFor="let error of errors">Fila {{ error.row }}: {{ error.message }}</li>
  </ul>

  <div class="import-modal__actions">
    <button type="button" class="import-modal__cancel" (click)="close()" [disabled]="importing">Cancelar</button>
    <button type="button" class="import-modal__submit" (click)="importFile()" [disabled]="!file || !groupId || importing">
      <lucide-icon [img]="Upload" [size]="16"></lucide-icon>
      {{ importing ? 'Importando…' : 'Importar' }}
    </button>
  </div>
</div>
